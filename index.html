<section class="gallery" id="galerie">
  <h2>Images d'archives — 1914–1918</h2>

  <div class="gallery-grid">

    <article class="photo">
      <img src="https://commons.wikimedia.org/wiki/Special:FilePath/French%20soldiers%20in%20the%20trenches%20during%20World%20War%20I.jpg"
           alt="Soldats français dans les tranchées"
           onclick="openPhoto(this)">
      <h3>Dans les tranchées</h3>
      <p>Le quotidien des soldats sur le front.</p>
    </article>

    <article class="photo">
      <img src="https://images.unsplash.com/photo-1519074069444-1ba4fff66d16"
           alt="Paysage de guerre"
           onclick="openPhoto(this)">
      <h3>Un paysage bouleversé</h3>
      <p>La guerre transforme profondément les paysages.</p>
    </article>

    <article class="photo">
      <img src="https://commons.wikimedia.org/wiki/Special:FilePath/World%20War%20I%20soldiers.jpg"
           alt="Soldats de la Première Guerre mondiale"
           onclick="openPhoto(this)">
      <h3>Les soldats</h3>
      <p>Des millions d'hommes mobilisés.</p>
    </article>

  </div>
</section>

<!-- Fenêtre d'agrandissement -->
<div id="photoModal" class="photo-modal" onclick="closePhoto()">
  <span class="close">&times;</span>
  <img id="modalImage">
  <p id="modalCaption"></p>
</div>

<style>
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 25px;
}

.photo {
  background: #151923;
  padding: 15px;
  border-radius: 15px;
  color: white;
}

.photo img {
  width: 100%;
  height: 250px;
  object-fit: cover;
  border-radius: 10px;
  cursor: pointer;
  transition: transform .4s, filter .4s;
  filter: grayscale(100%);
}

.photo img:hover {
  transform: scale(1.03);
  filter: grayscale(0%);
}

.photo-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.95);
  z-index: 9999;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  padding: 25px;
}

.photo-modal img {
  max-width: 90%;
  max-height: 80vh;
  border-radius: 10px;
  animation: zoomIn .35s ease;
}

.photo-modal p {
  color: white;
  margin-top: 15px;
}

.close {
  color: white;
  font-size: 40px;
  cursor: pointer;
  position: absolute;
  top: 20px;
  right: 35px;
}

@keyframes zoomIn {
  from { transform: scale(.7); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
</style>

<script>
function openPhoto(img) {
  const modal = document.getElementById("photoModal");
  const modalImage = document.getElementById("modalImage");
  const caption = document.getElementById("modalCaption");

  modalImage.src = img.src;
  caption.textContent = img.alt;
  modal.style.display = "flex";
}

function closePhoto() {
  document.getElementById("photoModal").style.display = "none";
}
</script>
